    <main><div class="container">
    <h2>Teacher Grading Sheet</h2>

    <h3 id="name"> </h3>

    <table>
        <tr></th>
            <th>Subject
            <th>Grade 
        </tr>

        <tr>
            <td>Math</td>
            <td><p id="math"></p></td>
        </tr>

        <tr>
            <td>Science</td>
            <td><p id="science"></p></td>
        </tr>

        <tr>
            <td>OOP</td>
            <td><p id="oop"></p></td>
        </tr>

        <tr>
            <td>English</td>
            <td><p id="english"></p></td>
        </tr>

         <tr>
            <td>Event driven programming</td>
            <td><p id="event-driven"></p></td>
        </tr> 
        
        <tr>
            <td>Rizal</td>
            <td><p id="rizal"></p></td>
        </tr>
        
        <tr>
            <td>Popular culture</td>
            <td><p id="popular-culture"></p></td>
        </tr>
    </table>
</div>
</main>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>
    <script>

let user = JSON.parse(localStorage.getItem("user"));
let grades = JSON.parse(localStorage.getItem("grades")) || {};

if (user) {
    document.getElementById("name").innerText = user.name;

    let studentGrades = grades[user.id];

    if (studentGrades) {
        document.getElementById("math").innerText = studentGrades.math || "-";
        document.getElementById("science").innerText = studentGrades.science || "-";
        document.getElementById("oop").innerText = studentGrades.oop || "-";
        document.getElementById("english").innerText = studentGrades.english || "-";
        document.getElementById("event-driven").innerText = studentGrades.eventDriven || "-";
        document.getElementById("rizal").innerText = studentGrades.rizal || "-";
        document.getElementById("popular-culture").innerText = studentGrades.popularCulture || "-";
    } else {
        // if no grades yet
        document.getElementById("math").innerText = "No grade";
        document.getElementById("science").innerText = "No grade";
        document.getElementById("oop").innerText = "No grade";
        document.getElementById("english").innerText = "No grade";
        document.getElementById("event-driven").innerText = "No grade";
        document.getElementById("rizal").innerText = "No grade";
        document.getElementById("popular-culture").innerText = "No grade";
    }

} else {
    document.getElementById("name").innerText = "Unknown Student";
}
    








        function confirmLogout() {
    let result = confirm("Are you sure you want to sign out?");
    
    if (result) {
       
        window.location.href = "1pages.html"; 
    } else {
        
        return false;
    }
}
</script>
