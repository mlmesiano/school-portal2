<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css-layout-header.css">
    <link rel="stylesheet" href="navbar-design.css">
    <style>  * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(to right, #e8f5e9, #f0f0f0);
            color: #1f2937;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

form {
    background: rgba(255, 255, 255, 0.95);
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    width: 320px;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    transition: 0.3s;
}

input:focus {
    border-color: #009650;
    outline: none;
    box-shadow: 0 0 6px rgba(0,150,80,0.3);
}
button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #026022, #009650);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.03);
    opacity: 0.95;
}
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
     margin-bottom: 15px;
}

select:focus {
    border-color: #4CAF50;
}
.login-link a {
    color: #009650;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.login-link a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>
    <header class="header1">
        <img src="logo.png" alt="error" id="logo">
        <h1>Hi, Student</h1>
    </header>
    <nav>
        <div class="logo">MySite</div>

        <!-- Hidden checkbox for hamburger -->
        <input type="checkbox" id="menu-toggle">

        <!-- Hamburger icon -->
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <ul>
           
            <li><a  onclick="return confirmLogout()" href="1pages.html" >Sign out</a></li>
        </ul>
    </nav>
    <main> 
         <form onsubmit="registerUser(); return false;">
    <h2>Create Account</h2>

        <input type="digit" id="std-id" placeholder="Student ID">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <input type="text" id="course" placeholder="Course">
        <input type="number" id="contact" placeholder="Contact Number">
        <select id="section">
  <option value="" disabled selected>Select section</option>
  <option value="Alpha">Alpha</option>
  <option value="Bravo">Bravo</option>
  <option value="Charlie">Charlie</option>
</select>
        <input type="text" id="skills" placeholder="Skills and Interests">

    <button type="submit">Register</button>

    <div class="login-link">
        Already have an account?
        <a href="student-login.html">Login</a>
    </div>


    </main>
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>
</body>
<script>
    function registerUser() {

    let pass = document.getElementById("password").value;
    let confirmPass = document.getElementById("confirmPassword").value;

    if (pass !== confirmPass) {
        alert("Passwords do not match!");
        return;
    }

    let user = {
        id: document.getElementById("std-id").value,
        password: pass,
        name: document.getElementById("name").value,
        course: document.getElementById("course").value,
        contact: document.getElementById("contact").value,
        section: document.getElementById("section").value,
        skills: document.getElementById("skills").value
    };

    if (!user.id || !pass || !user.name || !user.course) {
        alert("Please fill all required fields!");
        return;
    }

    let users = JSON.parse(localStorage.getItem("registeredUsers")) || [];

    let exists = users.some(u => u.id === user.id);

    if (exists) {
        alert("Student ID already exists!");
        return;
    }

    users.push(user);

    localStorage.setItem("registeredUsers", JSON.stringify(users));

    alert("Registered successfully!");
    window.location.href = "student-login.html";
}
</script>
</html>
